<main class="fgsauto-cases-main">
  <section class="fgsauto-cases-hero" aria-label="FG'S AUTO cases">
    <a class="fgsauto-cases-back" href="/FGSAUTO/">
      <i class="ti ti-arrow-left"></i>
      FG'S AUTO
    </a>
    <div class="fgsauto-cases-hero__brand">
      <img src="/assets/images/FGSAUTOLOGO.svg" width="56" height="56" alt="" decoding="async" />
      <div>
        <div class="sec-tag">Work Showcase</div>
        <h1 class="fgsauto-cases-hero__title">
          <span id="fgsauto-cases-heading">案例展示</span>
          <span class="fgsauto-cases-hero__tag" id="fgsauto-cases-tag"></span>
        </h1>
        <p class="fgsauto-cases-hero__desc" id="fgsauto-cases-desc"></p>
      </div>
    </div>
  </section>

  <nav class="fgsauto-cases-nav-bar" id="fgsauto-cases-nav" aria-label="Case categories"></nav>

  <div class="fgsauto-cases-gallery-wrap">
    <div class="fgsauto-cases-gallery" id="fgsauto-cases-gallery" aria-live="polite"></div>
    <div class="fgsauto-cases-empty" id="fgsauto-cases-empty" hidden>
      <p>该分类暂无案例，请在 scripts/config.js 的 fgsAutoCases 中添加。</p>
    </div>
  </div>
</main>
