<main class="media-gallery-main">
  <section class="media-gallery-hero" id="media-gallery-hero" aria-label="Full Great Media">
    <div class="fgmedia-brand" id="fgmedia-brand" tabindex="0">
      <div class="fgmedia-brand__stage" aria-hidden="false">
        <div class="fgmedia-brand__logo fgmedia-brand__logo--en">
          <img src="/assets/svg/fgmedia.svg" alt="Full Great Media" decoding="async" fetchpriority="high" />
        </div>
        <div class="fgmedia-brand__logo fgmedia-brand__logo--cn" aria-hidden="true">
          <img src="/assets/svg/fgmediacn.svg" alt="" decoding="async" />
        </div>
        <span class="fgmedia-brand__rect-wipe" aria-hidden="true"></span>
      </div>
    </div>
  </section>

  <nav class="media-collections-bar" id="media-collections" aria-label="Photo collections"></nav>

  <div class="media-fluid-wrap" id="media-fluid-wrap">
    <div class="media-fluid-grid" id="media-gallery-grid" aria-live="polite"></div>
    <div class="media-fluid-empty" id="media-gallery-empty" hidden>
      <p>No images in this collection yet.</p>
    </div>
  </div>
</main>
